
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Siti Nurhaliza Jamilatur Rizkiyah</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffe6e6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        #intro p {
            color: #ff4d4d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-buka {
            padding: 10px 28px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
            animation: bounce 2s infinite;
        }

        #main-content {
            display: none; 
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 20px; 
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.15);
            text-align: left;
            width: 96%; 
            max-width: 480px; 
            box-sizing: border-box;
            
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 1.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        height 0.4s ease-out; 
            
            overflow: hidden; 
        }

        .card.muncul {
            opacity: 1;
            transform: translateY(0) scale(1);
            box-shadow: 0 15px 35px rgba(255, 77, 77, 0.25);
        }

        .card h2 { color: #ff4d4d; margin-bottom: 12px; font-size: 20px; text-align: center; margin-top: 0; }
        .card p { color: #555; font-size: 13.5px; line-height: 1.5; margin-bottom: 10px; margin-top: 0; }
        
        .pengirim {
            text-align: right !important;
            font-weight: 600;
            color: #ff4d4d !important;
            margin-top: 15px;
            margin-bottom: 0;
        }

        .btn-wrapper { text-align: center; margin-top: 15px; }

        .btn-maaf {
            display: none;
            padding: 10px 25px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.3);
            transition: transform 0.2s;
        }
        
        .btn-maaf:active { transform: scale(0.95); }

        #outro {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        #outro .big-heart {
            font-size: 80px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 20px;
            color: #ff4d4d;
        }

        #outro h1 {
            color: #ff4d4d;
            text-align: center;
            font-size: 22px;
            margin: 0 20px;
        }

        .falling-heart {
            position: fixed;
            top: -50px; 
            color: #ff4d4d;
            z-index: 999;
            pointer-events: none;
            animation: fallDown linear forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes bounce { 
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes fallDown { 
            0% { transform: translateY(0) rotate(0deg); opacity: 1; } 
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } 
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <div id="intro">
        <p>Pagi Umi, ada pesan nih...</p>
        <button class="btn-buka" onclick="bukaPesan()">Buka Pesan 💌</button>
    </div>

    <div id="main-content">
        <div class="card" id="pesan-card">
            <h2 id="text-1"></h2>
            <p id="text-2"></p>
            <p id="text-3"></p>
            <p id="text-4"></p>
            <p id="text-5" class="pengirim"></p>
            
            <div class="btn-wrapper">
                <button id="btn-maaf" class="btn-maaf" onclick="terimaKasih()">Iya Iya dimaafin ❤️</button>
            </div>
        </div>
    </div>

    <div id="outro">
        <div class="big-heart">❤️</div>
        <h1>Terima kasih banyak, sayang. <br>I love you!</h1>
    </div>

    <script>
        const kalimat1 = "Halo sayangku... 🥺";
        const kalimat2 = "Aku nulis ini karena aku bener-bener ngerasa bersalah. Maafin aku ya karena selama ini sering banget nutup telinga dari nasehat kamu dan ngerasa paling bener sendiri.";
        const kalimat3 = "Padahal setelah aku pikir-pikir, semua yang kamu omongin itu bener. Kamu cerewet karena peduli, dan aku malah ngeresponnya pakai ego. Maaf udah bikin kamu capek ngadepinnya.";
        const kalimat4 = "Mulai sekarang, aku janji bakal nurunin egoku, lebih dengerin kamu, dan belajar jadi yang lebih baik buat kamu.";
        const kalimat5 = "Dari cowokmu yang keras kepala, Mas Alghi.";

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playKeystroke() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine'; 
            
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
            
            // Volume ketikan dipertahankan
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        async function ketikTeks(elementId, text, kecepatan) {
            const elemen = document.getElementById(elementId);
            const card = document.getElementById('pesan-card');
            
            for (let i = 0; i < text.length; i++) {
                const huruf = text.charAt(i);
                elemen.innerHTML += huruf;
                card.style.height = card.scrollHeight + 'px';
                
                if (huruf !== ' ') {
                    playKeystroke();
                }
                
                await new Promise(resolve => setTimeout(resolve, kecepatan));
            }
        }

        function bukaPesan() {
            initAudio(); 

            // MULAI MEMAINKAN MUSIK LATAR
            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.3; // Volume musik diset ke 30% agar tidak menutupi suara ketikan
            bgMusic.play().catch(e => console.log("Audio tertahan oleh browser"));

            const intro = document.getElementById('intro');
            const mainContent = document.getElementById('main-content');
            const card = document.getElementById('pesan-card');
            
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                mainContent.style.display = 'flex';
                
                card.style.height = card.scrollHeight + 'px';
                
                setTimeout(() => {
                    card.classList.add('muncul');
                    jalankanAnimasiKetik();
                }, 100);
            }, 800);
        }

        async function jalankanAnimasiKetik() {
            await new Promise(resolve => setTimeout(resolve, 900));

            await ketikTeks('text-1', kalimat1, 80);
            await new Promise(resolve => setTimeout(resolve, 800));

            await ketikTeks('text-2', kalimat2, 60);
            await new Promise(resolve => setTimeout(resolve, 800));

            await ketikTeks('text-3', kalimat3, 60);
            await new Promise(resolve => setTimeout(resolve, 800));
            
            await ketikTeks('text-4', kalimat4, 60);
            await new Promise(resolve => setTimeout(resolve, 800));

            await ketikTeks('text-5', kalimat5, 80);
            await new Promise(resolve => setTimeout(resolve, 1000));

            const btnMaaf = document.getElementById('btn-maaf');
            const card = document.getElementById('pesan-card');
            
            btnMaaf.style.display = 'inline-block';
            card.style.height = card.scrollHeight + 'px';
            btnMaaf.style.animation = 'fadeIn 1s forwards, pulse 2s 1s infinite';
        }

        function terimaKasih() {
            document.getElementById('pesan-card').style.display = 'none';
            document.getElementById('outro').style.display = 'flex';
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.className = 'falling-heart';
                    
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                    
                    const durasi = Math.random() * 2 + 3; 
                    heart.style.animationDuration = durasi + 's';
                    
                    document.body.appendChild(heart);
                    
                    setTimeout(() => { heart.remove(); }, durasi * 1000);
                }, i * 80); 
            }
        }
    </script>

</body>
  </html>
